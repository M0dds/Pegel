appId: app.pegel.desktop
productName: Pegel
copyright: Pegel – inoffizieller Desktop-Client für YouTube Music
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - '!out/profile.json'
  - package.json
# Gift build profile (written by scripts/dist.mjs), read via process.resourcesPath.
extraResources:
  - from: out/profile.json
    to: profile.json
asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
nsis:
  # Assisted installer: choose the folder, Start menu and desktop shortcut,
  # uninstaller under "Apps". Per user, no admin rights needed.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pegel
  uninstallDisplayName: Pegel
  # Keep settings and the login when uninstalling (reinstall keeps working).
  deleteAppDataOnUninstall: false
  artifactName: Pegel-Setup-${version}.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: resources/icon.icns
  category: public.app-category.music
  # No Developer ID in v1: unsigned by electron-builder, ad-hoc signed in
  # scripts/after-pack.cjs (required on Apple Silicon).
  identity: null
  hardenedRuntime: false
dmg:
  artifactName: Pegel-${version}-${arch}.${ext}

afterPack: scripts/after-pack.cjs

# Updates: the release workflow uploads installers and latest*.yml to GitHub
# Releases; electron-updater (Windows) reads them from there.
publish:
  provider: github
  owner: M0dds
  repo: Pegel
  releaseType: draft
