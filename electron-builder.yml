# Packaging is finalised in M8 (icons, profiles, signing).
appId: app.pegel.desktop
productName: Pegel
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - '!out/profile.json'
  - package.json
# Gift build profile (written by scripts/dist.mjs), read via process.resourcesPath.
extraResources:
  - from: out/profile.json
    to: profile.json
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.music
